services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/cronos.db
    volumes:
      - cronos-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    init: true
  frontend:
    build: ./frontend
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    init: true

volumes:
  cronos-data:
