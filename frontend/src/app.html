<main><header><div><span class="eyebrow">PLANEJAMENTO DIÁRIO</span><h1>Meu tempo</h1></div><div class="total">{{total/60 | number:'1.0-0'}}h <small>de 24h</small></div></header>
<section class="card composer"><input [(ngModel)]="name" placeholder="O que você vai fazer?" (keyup.enter)="add()"><input type="number" [(ngModel)]="duration" min="1" max="1440" class="minutes"><span>min</span><button (click)="add()">Adicionar</button></section>
<section class="card timeline"><div class="line"></div><article *ngFor="let b of blocks;let i=index" class="block" [class.current]="i===active&&!paused" [class.done]="i<active"><div class="dot"></div><div class="block-head"><div><strong>{{b.name}}</strong><small>{{b.durationMinutes}} min</small></div><button class="remove" (click)="remove(i)">×</button></div><div class="bar"><i [style.width.%]="i<active?100:i===active?100-(b.remaining!/(b.durationMinutes*60)*100):0"></i></div><div class="time">{{i===active?fmt(b.remaining!):i<active?'Concluído':fmt(b.durationMinutes*60)}}</div></article><p *ngIf="!blocks.length" class="empty">Adicione sua primeira atividade.</p></section>
<section class="player"><div><span class="eyebrow">{{blocks[active]?.name || 'Nenhuma atividade'}}</span><strong>{{blocks[active]?fmt(blocks[active].remaining!):'00:00:00'}}</strong></div><button class="pause" (click)="toggle()">{{paused?'▶ Continuar':'Ⅱ Pausar'}}</button></section></main>
